<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJP Party Office</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <style>
        .office-container {
            max-width: 600px;
            margin: 4rem auto;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 140, 0, 0.3);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.2);
        }
        #welcomeMessage {
            display: none;
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(255, 140, 0, 0.1);
            border: 1px solid var(--primary-color);
            border-radius: 15px;
            animation: fadeUp 0.5s ease-out;
        }
        .nav-back {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s;
        }
        .nav-back:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>
    
    <a href="index.html" class="nav-back">← Back to Manifesto</a>

    <main class="office-container">
        <img src="assets/images/logo.png" alt="MJP Logo" style="width: 100px; margin-bottom: 1rem;">
        <h1>MJP Headquarters</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Register yourself as an official comrade of the Momo Janta Party.</p>
        
        <div class="card" id="registrationCard">
            <form id="partyForm">
                <div class="form-group">
                    <label for="comradeName">Name or Nickname</label>
                    <input type="text" id="comradeName" class="form-control" required placeholder="e.g. Momo King">
                </div>
                
                <div class="form-group">
                    <label for="xHandle">X (Twitter) Handle</label>
                    <input type="text" id="xHandle" class="form-control" placeholder="@username">
                </div>

                <div class="form-group">
                    <label for="momoPref">Preferred Momo Filling</label>
                    <select id="momoPref" class="form-control" required>
                        <option value="">Select your filling...</option>
                        <option value="Veg">Vegetable</option>
                        <option value="Paneer">Paneer</option>
                        <option value="Chicken">Chicken</option>
                        <option value="Pork">Pork</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="chutneySpice">Chutney Spice Level (1-10)</label>
                    <input type="number" id="chutneySpice" class="form-control" min="1" max="10" value="5" required>
                </div>
                
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Sign the Register</button>
            </form>
        </div>

        <div id="welcomeMessage">
            <h2 style="color: var(--primary-color); margin-bottom: 1rem;">Registration Successful! 🎉</h2>
            <div style="background: linear-gradient(135deg, rgba(255,140,0,0.2) 0%, rgba(255,0,0,0.1) 100%); border: 2px solid var(--primary-color); border-radius: 15px; padding: 2rem; position: relative; overflow: hidden; text-align: left; box-shadow: 0 10px 30px rgba(255,140,0,0.2);">
                <div style="position: absolute; top: -20px; right: -20px; opacity: 0.1; font-size: 10rem;">🥟</div>
                <div style="display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid rgba(255,140,0,0.3); padding-bottom: 1rem; margin-bottom: 1rem;">
                    <img src="assets/images/logo.png" style="width: 50px; border-radius: 50%;">
                    <div>
                        <h3 style="margin: 0; color: white;">Momo Janta Party</h3>
                        <small style="color: var(--primary-color);">Official Digital ID Card</small>
                    </div>
                </div>
                <p style="margin: 0.5rem 0; color: var(--text-muted);"><strong>Name:</strong> <span id="outName" style="color: white; font-size: 1.2rem;"></span></p>
                <p style="margin: 0.5rem 0; color: var(--text-muted);"><strong>X (Twitter):</strong> <span id="outX" style="color: #1DA1F2;"></span></p>
                <p style="margin: 0.5rem 0; color: var(--text-muted);"><strong>Filling:</strong> <span id="outPref" style="color: white;"></span></p>
                <p style="margin: 0.5rem 0; color: var(--text-muted);"><strong>Spice Tolerance:</strong> Level <span id="outSpice" style="color: red; font-weight: bold;"></span></p>
                <div style="margin-top: 1.5rem; text-align: center;">
                    <button class="btn" style="padding: 0.5rem 1.5rem; font-size: 0.9rem;" onclick="alert('Screenshot this card and share it on X tagging @momo_janta_party!')">📸 Share ID Card</button>
                </div>
            </div>
        </div>
    </main>

    <script src="office.js"></script>

    <footer style="margin-top: 4rem; text-align: center; padding: 2rem; border-top: 1px solid rgba(255,140,0,0.2);">
        <p style="color: var(--text-muted); font-size: 0.9rem;">
            Built with 🥟 by <a href="https://github.com/divyansh-rawat" target="_blank" style="color: var(--primary-color); text-decoration: none; font-weight: bold;">@divyansh-rawat</a> | 
            <a href="https://github.com/momo-janta-party/momo-janta-party" target="_blank" style="color: var(--text-muted); text-decoration: underline;">View Repository on GitHub</a>
        </p>
    </footer>
</body>

</html>
